function openValue(i){active=document.activeElement;document.getElementById('valueNumber').textContent=(i+1).toLocaleString('ar-SA');document.getElementById('weekLabel').textContent='الأسبوع '+(i+1).toLocaleString('ar-SA');document.getElementById('valueTitle').textContent=values[i].name;document.getElementById('valueDescription').textContent=values[i].desc;modal.classList.add('open');modal.focus()}
